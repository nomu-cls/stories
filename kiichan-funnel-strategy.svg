<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 950" style="background-color: #FDFBF7; font-family: 'Zen Maru Gothic', sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="100%" stop-color="#fdfdfd" />
    </linearGradient>
    <linearGradient id="grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C542" />
      <stop offset="100%" stop-color="#F29880" />
    </linearGradient>
    <linearGradient id="grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#85BDD9" />
      <stop offset="100%" stop-color="#6AA0C0" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.06" />
    </filter>

    <!-- Markers -->
    <marker id="arrow-down-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5C542" />
    </marker>
    <marker id="arrow-down-gray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ccc" />
    </marker>
    <marker id="arrow-up-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4A24E" />
    </marker>
    <marker id="arrow-left-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F5943A" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="60" font-size="30" font-weight="900" fill="#3D3226" text-anchor="middle">🌻 きいちゃん先生：0期〜1期 ファネル＆コンテンツ循環戦略</text>
  <line x1="100" y1="85" x2="900" y2="85" stroke="#F5C542" stroke-width="3" stroke-dasharray="6 4" opacity="0.5" />

  <!-- Funnel Background Shape (Optional visual cue) -->
  <polygon points="60,110 700,110 460,700 300,700" fill="#FFF9E6" stroke="#F5C542" stroke-width="2" stroke-dasharray="10 10" opacity="0.4"/>
  <text x="380" y="100" font-size="12" font-weight="700" fill="#C4A24E" text-anchor="middle">FUNNEL</text>


  <!-- =============================== -->
  <!-- FUNNEL STAGE 1: TRAFFIC         -->
  <!-- =============================== -->
  <g transform="translate(80, 130)">
    <rect width="600" height="120" rx="20" fill="url(#grad-1)" filter="url(#shadow)" stroke="#ccc" stroke-width="1" />
    <rect width="12" height="120" rx="6" fill="#8CB88A" />
    <text x="300" y="45" font-size="24" font-weight="900" fill="#3D3226" text-anchor="middle">① 認知・教育（YouTube / note / メルマガ）</text>
    <text x="300" y="80" font-size="16" font-weight="700" fill="#666" text-anchor="middle">すべての動線を「マインドセッション」へ集中させる</text>
    <text x="300" y="105" font-size="13" font-weight="700" fill="#8CB88A" text-anchor="middle">▼ アクセス・認知を拡大し、次のフェーズへ送る ▼</text>
  </g>

  <!-- Down Arrow 1 -->
  <polygon points="380,270 360,250 400,250" fill="url(#grad-2)" />
  <rect x="370" y="250" width="20" height="20" fill="url(#grad-2)" />


  <!-- =============================== -->
  <!-- FUNNEL STAGE 2: FRONT-END       -->
  <!-- =============================== -->
  <g transform="translate(140, 310)">
    <rect width="480" height="160" rx="24" fill="url(#grad-2)" filter="url(#shadow)" />
    <text x="240" y="45" font-size="24" font-weight="900" fill="#FFF" text-anchor="middle">② マインドセッション（フロントエンド）</text>
    
    <rect x="20" y="65" width="440" height="80" rx="12" fill="#FFF" fill-opacity="0.95" />
    <text x="40" y="90" font-size="15" font-weight="900" fill="#C4A24E">💡 先着100名まで完全無料（その後は実施なし）</text>
    <text x="40" y="115" font-size="15" font-weight="900" fill="#C4A24E">💡 目的①：ケーススタディ収集 ＆ コンテンツへの昇華</text>
    <text x="40" y="135" font-size="15" font-weight="900" fill="#e06b6b">🎯 目的②：3ヶ月実践講座への誘導（セールス）</text>
  </g>

  <!-- Down Arrow 2 -->
  <polygon points="380,490 360,470 400,470" fill="url(#grad-3)" />
  <rect x="370" y="470" width="20" height="20" fill="url(#grad-3)" />


  <!-- =============================== -->
  <!-- FUNNEL STAGE 3: BACK-END        -->
  <!-- =============================== -->
  <g transform="translate(180, 530)">
    <rect width="400" height="140" rx="24" fill="url(#grad-3)" filter="url(#shadow)" />
    <text x="200" y="45" font-size="24" font-weight="900" fill="#FFF" text-anchor="middle">③ ３ヶ月実践講座（1期生）</text>
    
    <rect x="20" y="65" width="360" height="60" rx="12" fill="#FFF" fill-opacity="0.95" />
    <text x="200" y="90" font-size="16" font-weight="900" fill="#6AA0C0" text-anchor="middle">🗓️ 7月〜8月に「1期生」として開講予定</text>
    <text x="200" y="115" font-size="14" font-weight="700" fill="#6AA0C0" text-anchor="middle">LPをご案内し、成約（クロージング）へ</text>
  </g>


  <!-- =============================== -->
  <!-- FLYWHEEL LOOP: CONTENT CREATION -->
  <!-- =============================== -->
  <!-- Content Creation Box -->
  <g transform="translate(710, 240)">
    <rect width="250" height="150" rx="16" fill="#FFF9E6" filter="url(#shadow)" stroke="#F5C542" stroke-width="2" />
    <text x="125" y="40" font-size="20" font-weight="900" fill="#3D3226" text-anchor="middle">📺 コンテンツ制作</text>
    <line x1="20" y1="55" x2="230" y2="55" stroke="#F5C542" stroke-width="1" />
    <text x="125" y="75" font-size="12" font-weight="700" fill="#e06b6b" text-anchor="middle">※ワンソース・マルチユース</text>
    <text x="125" y="100" font-size="12" font-weight="700" fill="#666" text-anchor="middle">1. YouTube【外向け：ノウハウ・事例】</text>
    <text x="125" y="120" font-size="12" font-weight="700" fill="#666" text-anchor="middle">2. note【外向け：ノウハウ・事例】</text>
    <text x="125" y="140" font-size="12" font-weight="900" fill="#e06b6b" text-anchor="middle">3. メルマガ/LINE【内向け：プライベート】</text>
  </g>

  <!-- Loop Arrow 1: Session -> Content (Extraction) -->
  <g>
    <!-- Arrow from Right edge of Session (620, 390) to Bottom of Content (835, 390) -->
    <path d="M 620,390 C 720,390 835,480 835,405" fill="none" stroke="#C4A24E" stroke-width="4" stroke-dasharray="6 4" />
    <polygon points="835,405 828,415 842,415" fill="#C4A24E" /> <!-- Arrowhead UP -->
    
    <rect x="670" y="420" width="220" height="50" rx="10" fill="#FFF" fill-opacity="0.95" stroke="#F5E6D0" stroke-width="1.5" />
    <text x="780" y="440" font-size="14" font-weight="900" fill="#C4A24E" text-anchor="middle">セッションでの事例・変化を</text>
    <text x="780" y="460" font-size="14" font-weight="900" fill="#C4A24E" text-anchor="middle">コンテンツへ昇華（ネタ循環）</text>
  </g>

  <!-- Loop Arrow 2: Content -> Traffic -->
  <g>
    <!-- Arrow from Top of Content box (835, 240) to Top of Phase 1 (680, 190) -->
    <path d="M 835,240 C 835,100 750,100 690,190" fill="none" stroke="#F5943A" stroke-width="4" stroke-dasharray="8 4" />
    <polygon points="690,190 683,180 697,180" fill="#F5943A" transform="rotate(-40 690 190)" /> 
    
    <rect x="690" y="80" width="240" height="50" rx="10" fill="#FFF" fill-opacity="0.95" stroke="#F5E6D0" stroke-width="1.5" />
    <text x="810" y="100" font-size="14" font-weight="900" fill="#F5943A" text-anchor="middle">SNSアクセスポイントの増加</text>
    <text x="810" y="120" font-size="12" font-weight="700" fill="#888" text-anchor="middle">（多媒体展開による新規流入）</text>
  </g>


  <!-- =============================== -->
  <!-- BOTTOM PANEL: System (UTAGE)    -->
  <!-- =============================== -->
  <g transform="translate(100, 750)">
    <rect width="800" height="80" rx="16" fill="#FFF" filter="url(#shadow)" stroke="#b8a9d8" stroke-width="2" />
    <rect width="16" height="80" rx="8" fill="#b8a9d8" />
    <text x="40" y="45" font-size="22" font-weight="900" fill="#3D3226">🛠️ システム化・自動化の導入</text>
    <text x="360" y="35" font-size="14" font-weight="700" fill="#666">✅ LP作成、決済システム、講座のリマインド等を一元化・自動化</text>
    <text x="360" y="60" font-size="14" font-weight="700" fill="#666">✅ 次回MTGにて「UTAGE」のデモンストレーションを実施予定</text>
  </g>

</svg>
